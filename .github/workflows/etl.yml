name: BPS Data Warehouse ETL

on:
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

      - name: Debug secrets (masked)
        run: |
          echo "BPS_API_KEY set: ${{ secrets.BPS_API_KEY != '' }}"
          echo "DATABASE_URL set: ${{ secrets.DATABASE_URL != '' }}"
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run BPS ETL
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m src.pipeline \
            --domain 0000 \
            --var 192 \
            --th 2020,2021,2022,2023
